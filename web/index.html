<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>財產盤點</title>
<link rel="stylesheet" href="style.css?v=2.5">
</head>
<body>
<header>
  <h1>財產盤點</h1>
  <div id="stats">—</div>
  <span id="modeBadge" class="badge">連線</span>
</header>

<nav id="tabs">
  <button data-tab="scan" class="on">掃描</button>
  <button data-tab="list">未盤點</button>
  <button data-tab="set">設定/同步</button>
</nav>

<main>
  <section id="tab-scan">
    <div id="result" class="card idle">請掃描 QR code / 條碼</div>
    <div id="resultActions" class="row" hidden></div>
    <div id="scanStatus" class="hint" hidden></div>
    <div id="diag" class="hint">診斷中…</div>
    <div id="camHint" class="hint" hidden></div>
    <div id="reader"></div>
    <div id="zoomBox" class="row" hidden>
      <input type="range" id="zoom" hidden>
      <button id="btnTorch" hidden></button>
    </div>
    <div class="row">
      <button id="btnCam" class="primary">開啟相機</button>
    </div>
    <div class="row">
      <input id="manual" placeholder="手動輸入財產編號" enterkeyhint="go" autocomplete="off" autocapitalize="characters">
      <button id="btnManual">查詢</button>
    </div>
    <h3>本次紀錄</h3>
    <ol id="history"></ol>
  </section>

  <section id="tab-list" hidden>
    <input id="filter" placeholder="篩選(編號/品名/地點)">
    <div id="listInfo" class="hint"></div>
    <ul id="list"></ul>
  </section>

  <section id="tab-set" hidden>
    <h3>基本</h3>
    <label>盤點人(選填)<input id="who" placeholder="姓名"></label>
    <label class="radio"><input type="checkbox" id="needConfirm"> 掃到後先顯示品名,按「確認盤點」才記錄(建議開啟)</label>
    <label id="pinLabel">PIN(後台有設定才需要)<input id="pin" type="password" inputmode="numeric" placeholder="PIN"></label>

    <div id="modeBox">
    <div id="modeBox">
      <h3>模式</h3>
      <label class="radio"><input type="radio" name="mode" value="online"> 連線即時(每掃一筆就連後台比對)</label>
      <label class="radio"><input type="radio" name="mode" value="offline"> 離線(先下載清單到手機,掃完再同步)</label>
    </div>
    </div>

    <div id="onlineBox">
      <h3>後台檔案</h3>
      <button id="btnDlUncounted">下載「未盤點清單」CSV</button>
      <button id="btnDlResult">下載完整結果檔</button>
    </div>

    <div id="offlineBox" hidden>
      <h3>離線資料</h3>
      <div id="offInfo" class="hint"></div>
      <button id="btnDownloadData">① 從後台下載清單到手機</button>
      <button id="btnLoadFile">①' 從手機載入清單檔(.csv)</button>
      <button id="btnLoadBuiltin" hidden>①'' 載入網頁內建的測試清單</button>
      <input type="file" id="dataIn" accept=".csv,.txt,text/csv,text/plain" hidden>
      <div id="importBox" hidden>
        <label>編號欄位(掃到的內容要對應哪一欄)<select id="selKey"></select></label>
        <label>品名欄位<select id="selName"></select></label>
        <button id="btnImportOk" class="primary">載入這份清單</button>
      </div>
      <button id="btnSync" class="primary">③ 同步回後台</button>
      <button id="btnExportCsv">③' 匯出掃描結果 CSV(改用傳檔)</button>
      <button id="btnExportFull">匯出完整清單(含未盤點)CSV</button>
      <button id="btnClear" class="danger">清除手機上的離線資料</button>
      <div class="hint">② 到現場掃描(可離線)。同步前請勿清除瀏覽器資料或關閉分頁以外的隱私模式。</div>
    </div>
    <div id="msg" class="hint"></div>
  </section>
</main>

<script src="vendor/zxing_reader.iife.js?v=2.5"></script>
<script src="js/matcher.js?v=2.5"></script>
<script src="js/local.js?v=2.5"></script>
<script src="js/importer.js?v=2.5"></script>
<script src="js/api.js?v=2.5"></script>
<script src="js/feedback.js?v=2.5"></script>
<script src="js/decoder.js?v=2.5"></script>
<script src="js/scanner.js?v=2.5"></script>
<script src="js/ui.js?v=2.5"></script>
<script src="js/app.js?v=2.5"></script>
<script>
/* 若相關程式檔沒載入(例如只複製了 index.html),直接在畫面上說明 */
setTimeout(function () {
  if (window.AI && AI.scanner && AI.decoder && AI.local) return;
  var r = document.getElementById("result"), d = document.getElementById("diag");
  if (r) { r.className = "card error"; r.innerHTML = "<b>程式檔案沒有載入</b><br>只有 index.html 是不能用的。請把整個 web 資料夾(含 js、vendor 子資料夾)一起放到網站上。"; }
  if (d) d.textContent = "版本 2.5 ｜ 程式檔案:未載入";
}, 800);
</script>
</body>
</html>
